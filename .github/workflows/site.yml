name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JEKYLL_ENV: production

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend tools
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Audit al-folio migration compatibility
        run: bundle exec al-folio upgrade audit

      - name: Build production site
        run: bundle exec jekyll build --trace

      - name: Remove unused CSS
        run: npm run css:purge

      - name: Check generated internal links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --offline --root-dir _site --verbose --no-progress '_site/**/*.html'

      - name: Upload generated site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: generated-site
          path: _site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: generated-site
          path: _site

      - name: Publish gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
